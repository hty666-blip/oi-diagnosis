name: ci

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: oiuser
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: oidiag_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U oiuser -d oidiag_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://oiuser:test-password@localhost:5432/oidiag_test
      TEST_DATABASE_URL: postgresql+asyncpg://oiuser:test-password@localhost:5432/oidiag_test
      LLM_ENABLED: "false"
      JWT_SECRET: ci-test-secret-that-is-not-a-production-key
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Migrate independent test database
        run: alembic upgrade head
      - name: Test
        run: pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v4
        with:
          version: "11"
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build

  tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install parsing deps
        run: pip install lxml
      - name: Surface lint smoke
        run: |
          status=0
          python tools/surface_lint.py --file examples/bad_fullwidth.cpp || status=$?
          test "$status" -eq 1
      - name: Package check smoke
        run: python tools/check_package.py --dir problems
