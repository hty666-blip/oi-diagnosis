name: ci

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: oi_diagnosis_test
          MYSQL_USER: gesp_user
          MYSQL_PASSWORD: test-password
          MYSQL_ROOT_PASSWORD: root-test-password
          MYSQL_ROOT_HOST: "%"
        ports: [3307:3306]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -ugesp_user -ptest-password --silent"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: mysql+asyncmy://root:root-test-password@127.0.0.1:3307/oi_diagnosis_test?charset=utf8mb4
      TEST_DATABASE_URL: mysql+asyncmy://root:root-test-password@127.0.0.1:3307/oi_diagnosis_test?charset=utf8mb4
      LLM_ENABLED: "false"
      REQUIRE_DATABASE_TESTS: "1"
      JWT_SECRET: ci-test-secret-that-is-not-a-production-key
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Migrate independent test database
        run: alembic upgrade head
      - name: Test
        run: pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "22"
          package-manager-cache: false
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: "11"
          run_install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build

  tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
      - name: Install parsing deps
        run: pip install lxml
      - name: Check tracked files for secrets
        run: python tools/check_secrets.py --all
      - name: Surface lint smoke
        run: |
          status=0
          python tools/surface_lint.py --file examples/bad_fullwidth.cpp || status=$?
          test "$status" -eq 1
      - name: Package check smoke
        run: python tools/check_package.py --dir problems
