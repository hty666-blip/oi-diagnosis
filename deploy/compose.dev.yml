name: oi-diag

# 开发环境：MySQL / redis / minio / go-judge
# 生产部署另见 deploy/compose.prod.yml（待 M6 补）

services:
  mysql:
    image: mysql:8.4
    container_name: oi-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-oi_diagnosis}
      MYSQL_USER: ${MYSQL_USER:-gesp_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change-me}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-root-password}
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysqldata:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      # 隔离恢复库账号仅有该库权限；允许迁移创建复核记录的防篡改触发器。
      - --log-bin-trust-function-creators=1
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: oi-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # MinIO 体积大、且当前镜像代理对它返回 403；开发期用本地文件系统代替，
  # 需要时再显式启用：docker compose --profile full up -d
  minio:
    image: minio/minio:latest
    container_name: oi-minio
    profiles: ["full"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "127.0.0.1:${MINIO_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  # 沙箱：必须 privileged（官方要求），且只挂在独立网络，不与业务容器互通
  judge:
    build:
      context: .
      dockerfile: judge.Dockerfile
      args:
        JUDGE_BASE_IMAGE: ${JUDGE_BASE_IMAGE:-criyle/go-judge:v1.13.3}
        DEBIAN_MIRROR: ${DEBIAN_MIRROR:-}
    image: oi-judge:dev
    container_name: oi-judge
    profiles: ["gojudge"]
    privileged: true
    shm_size: "256m"
    ports:
      - "127.0.0.1:${JUDGE_PORT:-5050}:5050"
    environment:
      # 只允许本机调用；生产务必改掉，并配合 -auth-token
      GOJUDGE_DEBUG: "0"
    networks:
      - judge-net
    restart: unless-stopped

volumes:
  mysqldata:
  redisdata:
  miniodata:

networks:
  judge-net:
    driver: bridge
    # 沙箱网络独立，业务容器默认不进这个网络
