        <article lang="zh-CN">
        <h1>P1421 小玉买文具</h1>

        
        <section>
            <h2>题目描述</h2>
            <div>
                                    班主任给小玉一个任务，到文具店里买尽量多的签字笔。已知一只签字笔的价格是 $1$ 元 $9$ 角，而班主任给小玉的钱是 $a$ 元 $b$ 角，小玉想知道，她最多能买多少只签字笔呢。

                            </div>
        </section>

        <section>
            <h2>输入格式</h2>
            <div>
                                    输入只有一行两个整数，分别表示 $a$ 和 $b$。
                            </div>
        </section>

        <section>
            <h2>输出格式</h2>
            <div>
                                    输出一行一个整数，表示小玉最多能买多少只签字笔。

                            </div>
        </section>

        <section>
            <h2>说明/提示</h2>
            <div>
                #### 数据规模与约定

对于全部的测试点，保证 $0 \leq a \leq 10^4$，$0 \leq b \leq 9$。
            </div>
        </section>    </article>
