        <article lang="zh-CN">
        <h1>P1035 [NOIP 2002 普及组] 级数求和</h1>

        
        <section>
            <h2>题目描述</h2>
            <div>
                                    已知：$S_n= 1+\dfrac{1}{2}+\dfrac{1}{3}+…+\dfrac{1}{n}$。显然对于任意一个整数 $k$，当 $n$ 足够大的时候，$S_n>k$。

现给出一个整数 $k$，要求计算出一个最小的 $n$，使得 $S_n>k$。

                            </div>
        </section>

        <section>
            <h2>输入格式</h2>
            <div>
                                    一个正整数 $k$。

                            </div>
        </section>

        <section>
            <h2>输出格式</h2>
            <div>
                                    一个正整数 $n$。
                            </div>
        </section>

        <section>
            <h2>说明/提示</h2>
            <div>
                **【数据范围】**

对于 $100\%$ 的数据，$1\le k \le 15$。

**【题目来源】**

NOIP 2002 普及组第一题
            </div>
        </section>    </article>
